<!DOCTYPE html>
<html>
<head>
    <title>Fake News Detector</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>🔍 Fake News Detector</h1>
    <p class="subtitle">Powered by RoBERTa — HuggingFace Transformers</p>

    <div class="card">
        <form action="/predict" method="POST">
            <textarea name="article" rows="10"
            placeholder="Paste your news article here..."></textarea>
            <br>
            <button type="submit" onclick="showSpinner()">Check News</button>
        </form>

        <div id="spinner" style="display:none; margin-top:20px;">
            <p>⏳ Analyzing article... please wait</p>
        </div>

        {% if prediction %}
        <div class="result {{ prediction.lower() }}">
            <h2>Result: {{ prediction }}</h2>
            <p>Confidence: {{ confidence }}%</p>
        </div>
        {% endif %}
    </div>

    <script>
        function showSpinner() {
            document.getElementById('spinner').style.display = 'block';
        }
    </script>

</body>
</html>

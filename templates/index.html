<!DOCTYPE html>
<html>
<head>
    <title>Fake News Detector</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Fake News Detector</h1>
    <p>Paste a news article below to check if it is real or fake.</p>

    <form action="/predict" method="POST">
        <textarea name="article" rows="10" cols="60" 
        placeholder="Paste your news article here..."></textarea>
        <br><br>
        <button type="submit">Check News</button>
    </form>

    {% if prediction %}
<div class="result {{ prediction.lower() }}">
    <h2>Result: {{ prediction }}</h2>
    <p>Confidence: {{ confidence }}%</p>
</div>
{% endif %}

</body>
</html>
